{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Autenticación{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"> {% block extra_css %}{% endblock %} {% block extra_head %}{% endblock %}
</head>

<body>

    {% block content %}{% endblock %}

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    {% if messages %}
    <div id="django-messages-auth" class="d-none">
        {% for message in messages %}
        <div class="django-message-auth-item" data-text="{{ message|escape }}" data-tags="{{ message.tags|default:'info'|escape }}">
        </div>
        {% endfor %}
    </div>

    <script>
        (function() {
            if (typeof Swal === "undefined") return;

            /*
                Evita duplicar avisos:
                Si la plantilla actual ya pintó mensajes con .mensaje-auto,
                no mostramos también el Toast global de base_auth.html.
            */
            if (document.querySelector(".mensaje-auto")) return;

            const dataEl = document.getElementById("django-messages-auth");
            if (!dataEl) return;

            const items = dataEl.querySelectorAll(".django-message-auth-item");

            const Toast = Swal.mixin({
                toast: true,
                position: "top-end",
                showConfirmButton: false,
                timer: 2500,
                timerProgressBar: true,
            });

            function mapIcon(tags) {
                const t = (tags || "").toLowerCase();

                if (t.includes("success")) return "success";
                if (t.includes("error") || t.includes("danger")) return "error";
                if (t.includes("warning")) return "warning";

                return "info";
            }

            items.forEach(function(item) {
                Toast.fire({
                    icon: mapIcon(item.dataset.tags),
                    title: item.dataset.text,
                });
            });
        })();
    </script>
    {% endif %} {% block extra_js %}{% endblock %}
</body>

</html>
